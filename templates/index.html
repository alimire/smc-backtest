<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMC Backtest — EURUSD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }

  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px;
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; }
  header span { font-size: 12px; color: #8b949e; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .controls { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
              padding: 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
  .field select, .field input {
    background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    padding: 8px 12px; border-radius: 6px; font-size: 14px; outline: none;
  }
  .field select:focus, .field input:focus { border-color: #58a6ff; }

  button#runBtn {
    background: #238636; color: #fff; border: none; padding: 9px 20px;
    border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  button#runBtn:hover { background: #2ea043; }
  button#runBtn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

  .spinner { display: none; align-items: center; gap: 8px; color: #8b949e; font-size: 13px; }
  .spinner.active { display: flex; }
  .spinner::before {
    content: ''; width: 16px; height: 16px; border: 2px solid #30363d;
    border-top-color: #58a6ff; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
           gap: 12px; margin-bottom: 24px; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .stat .val { font-size: 28px; font-weight: 700; color: #58a6ff; }
  .stat .lbl { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .stat.green .val { color: #3fb950; }
  .stat.yellow .val { color: #d29922; }

  .tabs { display: flex; gap: 2px; margin-bottom: 0; }
  .tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: 6px 6px 0 0;
         background: #21262d; color: #8b949e; border: 1px solid #30363d; border-bottom: none; }
  .tab.active { background: #161b22; color: #e6edf3; }

  .table-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 0 8px 8px 8px;
                overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #21262d; padding: 10px 12px; text-align: left; color: #8b949e;
       font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 8px 12px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.aplus td { background: #0d2218; }
  tr.aplus td:last-child { color: #3fb950; font-weight: 700; }
  .badge-long  { color: #3fb950; }
  .badge-short { color: #f85149; }
  .check { color: #3fb950; }
  .cross { color: #484f58; }

  .empty { text-align: center; padding: 60px; color: #8b949e; font-size: 14px; }
  #error { background: #2d1117; border: 1px solid #f85149; border-radius: 6px;
           padding: 12px 16px; margin-bottom: 16px; color: #f85149; font-size: 13px; display: none; }
</style>
</head>
<body>

<header>
  <h1>📈 SMC Backtest</h1>
  <span>Salim SMC rules · lokz / ny-am kill zones · A+ scanner</span>
</header>

<div class="container">

  <!-- Controls -->
  <div class="controls">
    <div class="field">
      <label>Symbol</label>
      <select id="symbol">
        <option value="EURUSD=X" selected>EURUSD</option>
        <option value="DX-Y.NYB">DXY</option>
        <option value="GBPUSD=X">GBPUSD</option>
      </select>
    </div>
    <div class="field">
      <label>Days</label>
      <select id="days">
        <option value="30">30 days</option>
        <option value="60" selected>60 days</option>
        <option value="90">90 days</option>
      </select>
    </div>
    <div class="field">
      <label>Session</label>
      <select id="session">
        <option value="both" selected>lokz + ny-am (Salim)</option>
        <option value="lokz">lokz only (7–10am UK)</option>
        <option value="ny-am">ny-am only</option>
        <option value="ny-pm">ny-pm only</option>
        <option value="all">All sessions</option>
      </select>
    </div>
    <div class="field">
      <label>Interval</label>
      <select id="interval">
        <option value="15m" selected>15m</option>
        <option value="1h">1h</option>
      </select>
    </div>
    <div class="field">
      <label>Min RR</label>
      <input id="min_rr" type="number" value="2" step="0.5" style="width:80px">
    </div>
    <button id="runBtn" onclick="runBacktest()">▶ Run Backtest</button>
    <div class="spinner" id="spinner">Running scan…</div>
  </div>

  <div id="error"></div>

  <!-- Stats -->
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="val" id="s-total">—</div><div class="lbl">Total setups</div></div>
    <div class="stat green"><div class="val" id="s-aplus">—</div><div class="lbl">A+ setups</div></div>
    <div class="stat yellow"><div class="val" id="s-smt">—</div><div class="lbl">A+ with SMT</div></div>
    <div class="stat green"><div class="val" id="s-wr">—</div><div class="lbl">Win rate (RR proxy)</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs" style="display:none">
    <div class="tab active" onclick="showTab('aplus', this)">⭐ A+ Setups</div>
    <div class="tab" onclick="showTab('all', this)">All Setups</div>
  </div>

  <!-- Tables -->
  <div class="table-wrap" id="tableWrap" style="display:none">
    <div id="tableContent"></div>
  </div>

</div>

<script>
let allRows = [];

async function runBacktest() {
  const btn = document.getElementById('runBtn');
  const spinner = document.getElementById('spinner');
  const errBox = document.getElementById('error');

  btn.disabled = true;
  spinner.classList.add('active');
  errBox.style.display = 'none';
  document.getElementById('stats').style.display = 'none';
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('tableWrap').style.display = 'none';

  const payload = {
    symbol:   document.getElementById('symbol').value,
    days:     document.getElementById('days').value,
    session:  document.getElementById('session').value,
    interval: document.getElementById('interval').value,
    min_rr:   document.getElementById('min_rr').value,
  };

  try {
    const res = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (data.error) {
      errBox.textContent = '⚠ ' + data.error;
      errBox.style.display = 'block';
      return;
    }

    allRows = data.rows;

    // Stats
    document.getElementById('s-total').textContent = data.total;
    document.getElementById('s-aplus').textContent = data.aplus;
    document.getElementById('s-smt').textContent   = data.smt_count;
    document.getElementById('s-wr').textContent    = data.win_rate + '%';
    document.getElementById('stats').style.display = 'grid';

    // Table
    document.getElementById('tabs').style.display = 'flex';
    document.getElementById('tableWrap').style.display = 'block';
    showTab('aplus', document.querySelector('.tab.active'));

  } catch (e) {
    errBox.textContent = '⚠ Network error: ' + e.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.classList.remove('active');
  }
}

function showTab(filter, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const rows = filter === 'aplus' ? allRows.filter(r => r.is_aplus) : allRows;
  renderTable(rows);
}

function renderTable(rows) {
  if (!rows.length) {
    document.getElementById('tableContent').innerHTML =
      '<div class="empty">No setups found for this filter.</div>';
    return;
  }

  const ck = v => v ? '<span class="check">✓</span>' : '<span class="cross">✗</span>';
  const dir = d => d === 'long'
    ? '<span class="badge-long">▲ Long</span>'
    : '<span class="badge-short">▼ Short</span>';

  let html = `<table>
    <tr>
      <th>Time (UTC)</th><th>Dir</th><th>Entry</th><th>SL</th><th>TP</th>
      <th>RR</th><th>Liq</th><th>IDM</th><th>POI</th><th>SMT</th>
      <th>Session</th><th>A+</th><th>Notes</th>
    </tr>`;

  for (const r of rows) {
    const cls = r.is_aplus ? ' class="aplus"' : '';
    html += `<tr${cls}>
      <td>${r.time.slice(0,16)}</td>
      <td>${dir(r.direction)}</td>
      <td>${r.entry_price}</td>
      <td>${r.stop_loss}</td>
      <td>${r.take_profit}</td>
      <td>${r.rr_ratio}</td>
      <td>${ck(r.pdh_pdl_swept)}</td>
      <td>${ck(r.idm_swept)}</td>
      <td><b>${r.poi_type}</b></td>
      <td>${ck(r.smt_confluence)}</td>
      <td>${r.session}</td>
      <td>${r.is_aplus ? '⭐' : ''}</td>
      <td style="color:#8b949e">${r.notes || ''}</td>
    </tr>`;
  }
  html += '</table>';
  document.getElementById('tableContent').innerHTML = html;
}
</script>
</body>
</html>
